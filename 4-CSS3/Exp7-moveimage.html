<html>
 <head>
   <title>CSS3 </title>
      <style>
        .mybox{
          
            margin: 50px;
            width: 200px;   
            background: url("hello.jpg")no-repeat;
            position: relative;
            animation: repeatit 10s linear 50ms infinite alternate;            
        }
        @keyframes repeatit {
          from {left :0;}
          to{left: 30%}
        } 
      </style>
 </head>
     <body>
       <div class="mybox"></div>                                                      
     </body>
