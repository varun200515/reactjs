<html>
    <head>
        <title>css3</title>
        <style>
            body{
                background-cololr: black;
            }
            @media screen and (min-width: 500px){
                body{
                    background-color: red;
                }
            }
            .abc{
                width: 100px;
                height: 1000px;
                background: url("images-hd-desktop-wallpaper.jpg") no-repeat;
                position:relative;
                animation: repeatit 1s linear infinite alternate;
            } 
            .hello{
                width: 500px;
                height: 500px;
                background: radial-gradient(circle,red,yellow,green);
            } 
            @keyframes repeatit{
            from{
                left: 0px;
            }

            to{
                left: 200px;
            }
        }
        </style>
    </head>
    <body>
        <h1>hello</h1>
        <div class="abc"></div>
        <div class="hello"></div>
        
    </body>
</html>
