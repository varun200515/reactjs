<html>
    <head>
        <title>javascript programming </title>
        <script>
            function delay(ms){
                return new Promise(function(resolve){
                    setTimeout(resolve,ms);
                });
            }
            async function runDemo(){
                await delay(1000);
                console.log("varun");
                await delay(2000);
                console.log("gupta");
                await delay(30000);
                console.log("javascript");
            }
            runDemo();
        </script>
    </head>
    <body>
        <h1>JavaScript ..promise api</h1>
    </body>
</html>
