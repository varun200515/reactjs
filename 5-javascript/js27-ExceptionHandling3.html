<!DOCTYPE html>
<html lang="en">
<head>
    <title>Throw Example</title>
</head>
<body>
    <script>
        function chechAge(age) {
            if(age < 18){
                throw "Age must be 18 or older";
            }
            return "Access granted";
        }
        try{
            let result= checkAge(2);
            document.write(result);
        }catch(err) {
            document.write("caught Exception Ram: " +err);
        }finally{
            document.write("<br>End of program.");
        }
    </script>
</body>
</html>
