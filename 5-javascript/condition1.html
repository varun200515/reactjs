<!DOCTYPE html>
<html>
<head>
    <title>Largest Number</title>
</head>
<body>

<script>
    let a = 100;
    let b = 200;
    let c = 300;

    if (a > b && a > c) {
        document.write("a is big: " + a);
        console.log(a);
    }
    else if (b > a && b > c) {
        document.write("b is big: " + b);
        console.log(b);
    }
    else {
        document.write("c is big: " + c);
        console.log(c);
    }
</script>

</body>
</html>
