<html>
    <head>
        <title>javascript functions</title>
        <script>
            function myMouseOver() {
                document.write("Mouse is over me!")
            }
        </script>
    </head>
    <body>
        <h2>mouse over event</h2>
        <div onmouseover="myMouseOver()">
            <h2>Move the mouse over this paragraph.</h2>
        </div>
    </body>
</html>
