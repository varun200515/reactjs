<html>
    <head>
        <title>Function Parameters</title>
        <script>
            function addition(a,b){
                var sum=a+b;
                return sum;
            }
            d=addition(1,2);
            document.write("d value :",d);
        </script>
    </head>
    <body>
        <h2>function parameters with return.</h2>
    </body>
</html>
