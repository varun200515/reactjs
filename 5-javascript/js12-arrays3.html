<!DOCTYPE html>
<html>
<head>
    <title>javascript</title>
</head>
<body>
<script>
    var fruits = ["Banana", "Orange", "Apple", "Mango"];
    document.write("before sorting: " + fruits + "<br>");
    fruits.sort();
    document.write("after sorting: " + fruits);
    document.write("<br>")
    document.write("<br>")
    document.write(fruits+"<br>");
    document.write("<br> reverse array<br>");
    fruits.reverse();
    document.write(fruits);

</script>
</body>
</html>
