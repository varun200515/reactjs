<html>
    <head>
        <title>javascript functions</title>
        <script>
            //with out Arrow functions
                function myfunction(){
                    document.write("This is function Executed..<br>")
                }
                myfunction();
                //Arrowfunction
                myfunction1 = () => {
                    document.write("This is Arrow function Executed...<br>")
                }
                myfunction1();
            </script>
    </head>
</html>
