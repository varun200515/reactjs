<html>
    <head>
        <title>ES6 programming</title>
    </head>
        <body>
            <h1>JavaScript. Classes</h1>
            <script>    //TATA
                var brand;
                class Car{
                    //TATA
                    constructor(name){
                        this.brand=name;
                    }   // constructor close
                display(){
                    document.write("<br>My Car Name is :"+this.brand);
                }
            }
            var mycar = new Car("TATA");
            document.write("<br>My car Name is : "+mycar.brand);
            mycar.display();
        </script>
    </body>
</html>
